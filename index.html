<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTech Academy - Gestão de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>DevTech Academy - Gerenciamento de Alunos </h1>

    <div class="container">
        <form id="aluno-form">
            <h2>Cadastrar Aluno</h2>
            <input type="hidden" id="aluno-id">
            
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required> </div>
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required> </div>
            <div>
                <label for="curso">Curso:</label>
                <select id="curso" required> <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            <div>
                <label for="notaFinal">Nota Final:</label>
                <input type="number" id="notaFinal" step="0.1" min="0" max="10" required> </div>
            
            <button type="submit" id="btn-salvar">Salvar</button> </form>

        <div class="tabela-container">
            <h2>Alunos Cadastrados</h2>
            <table id="alunos-tabela">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Curso</th>
                        <th>Nota Final</th>
                        <th>Ações</th> </tr>
                </thead>
                <tbody id="tabela-corpo">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="container relatorios">
        <h2>Relatórios</h2>
        <div class="botoes-relatorio">
            <button id="btn-aprovados">Listar Aprovados (Nota >= 7)</button> <button id="btn-media-notas">Calcular Média das Notas</button> <button id="btn-media-idades">Calcular Média das Idades</button> <button id="btn-ordem-alfabetica">Nomes em Ordem Alfabética</button> <button id="btn-alunos-curso">Qtd. Alunos por Curso</button> </div>
        <pre id="relatorio-output"></pre>
    </div>

    <script src="app.js"></script>
</body>
</html>
